# vsftpd configuration for virtual users with TLS
# Copy to /etc/vsftpd/vsftpd.conf, adjust, then: systemctl restart vsftpd
# Virtual users authenticate through the PAM service named below and are mapped
# to one local guest account, each locked into /var/ftp/<username>.

listen=YES
anonymous_enable=NO
local_enable=YES
write_enable=YES

# Virtual users are mapped to this local account (create it with: useradd -s /sbin/nologin virtualftp)
guest_enable=YES
guest_username=virtualftp
virtual_use_local_privs=YES
pam_service_name=vsftpd

# Lock every user into their own directory
chroot_local_user=YES
allow_writeable_chroot=YES
user_sub_token=$USER
local_root=/var/ftp/$USER
hide_ids=YES

# Connections and timeouts
connect_from_port_20=YES
dirmessage_enable=YES
idle_session_timeout=600
data_connection_timeout=120
ls_recurse_enable=NO
session_support=YES

# Passive mode: open the same port range in the firewall
pasv_enable=YES
pasv_min_port=20211
pasv_max_port=20218

# Logging
xferlog_enable=YES
xferlog_std_format=YES
xferlog_file=/var/log/xferlog
dual_log_enable=YES
vsftpd_log_file=/var/log/vsftpd.log
log_ftp_protocol=YES
syslog_enable=YES

ftpd_banner=Welcome to the CloudOps FTP server. Connections are encrypted with TLS.

# TLS (FTPS). Create the certificate first, for example:
# openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/ssl/vsftpd/vsftpd.pem -out /etc/ssl/vsftpd/vsftpd.pem
ssl_enable=YES
rsa_cert_file=/etc/ssl/vsftpd/vsftpd.pem
rsa_private_key_file=/etc/ssl/vsftpd/vsftpd.pem
allow_anon_ssl=NO
force_local_data_ssl=YES
force_local_logins_ssl=YES
# Allow TLS only: SSLv2 and SSLv3 are broken and must stay off
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
ssl_ciphers=HIGH
require_ssl_reuse=NO
